[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geomdsl"
version = "0.1.0"
description = "A small 2D geometry diagram DSL"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7"]

[project.optional-dependencies]
jupyter = ["ipython>=8"]
test = ["pytest>=8"]

[project.scripts]
geomdsl = "geomdsl.cli:main"

[tool.setuptools]
packages = ["geomdsl", "geomdsl.render"]
